name: Daily Regression Tests
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Run Production Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install -g pnpm@11 && pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Whitelist GitHub Actions IP in Cloudflare
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run Production Regression Tests
        env:
          SKIP_WEBSERVER: 'true'
          NEXT_PUBLIC_PAYLOAD_URI: 'https://cms.csclub.org.au'
          USER_AGENT: 'Uptimeflare'
          PLAYWRIGHT_USER_AGENT: 'Uptimeflare'
        run: pnpm exec playwright test tests/e2e/production.spec.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7